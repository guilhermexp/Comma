# Builds the macOS (arm64) desktop app and publishes it as a GitHub release of
# this repository. The installed app updates itself from
# https://github.com/<repo>/releases/latest/download through Velopack, so every
# published desktop release is a full (non-prerelease) release marked latest.
#
# A pushed tag v<version> builds and publishes. The tag must equal the version
# in clients/apps/electron/package.json. A manual run builds the selected ref
# and uploads the release files as a workflow artifact; it publishes only when
# `publish` is set and the selected ref is such a tag.
#
# Signing: ad hoc. The app is not notarized. Developer ID signing and
# notarization stay available in the release scripts (COMMA_MACOS_SIGN=1); this
# workflow does not configure them. See docs/release-operations.md.
#
# Local mode: the app ships its own backend (Postgres, Redis, MinIO and the
# `comma` OTP release) in Contents/Resources/local-backend and has no fixed API
# URL. The native prefix built from scripts/local-backend/ is cached by the
# hash of that folder (the manifest and the build scripts). The Mach-O gate fails the build when any binary
# loads a library from outside the app and the system.
#
# Local transcription: build:native compiles the CommaTranscriber helper
# (SwiftPM, FluidAudio) into Contents/Resources/native/macos and its license
# texts into Contents/Resources/licenses. The app does not contain the model;
# the helper downloads it when the user installs local transcription.
name: Desktop Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub release. Requires a v<version> tag as the ref.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Velopack's CLI must match the `velopack` npm binding in the lockfile.
  VPK_VERSION: 1.2.0

jobs:
  build:
    name: Build macOS arm64
    runs-on: macos-26
    timeout-minutes: 240
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    env:
      COMMA_BUILD_FLAVOR: prod
      COMMA_RELEASE_REPOSITORY: ${{ github.repository }}
      PUBLISH_REQUESTED: ${{ github.event_name == 'push' || inputs.publish }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: systems/connector/salix-connect/go.mod
          cache-dependency-path: systems/connector/salix-connect/go.sum

      # The verified kernel NIF of the backend release is built with Lean and
      # CMake; pkgconf resolves the static libsodium and libopus of the prefix.
      # These are build tools only: the Mach-O gate rejects any library they
      # would link from Homebrew.
      - name: Set up Lean, CMake, and pkgconf
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
          bash systems/native/verified_kernel/scripts/install-toolchain.sh systems/native/verified_kernel/lean-toolchain
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore the local backend prefix and downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tmp/local-backend/prefix-*
            .tmp/local-backend/downloads
            .tmp/local-backend/go/mod
          key: local-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clients/apps/electron/scripts/local-backend/**') }}

      # vpk is a .NET tool; this also sets DOTNET_ROOT so its launcher finds
      # the runtime.
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      # The SwiftPM key covers every native package's Package.resolved,
      # CommaTranscriber's FluidAudio pin included.
      - name: Restore Electron, SwiftPM, and Synch download caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/org.swift.swiftpm
            clients/apps/electron/.native-cache/synchronicity
          key: desktop-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'clients/apps/electron/scripts/synch-release.ts', 'clients/apps/electron/native/**/Package.resolved') }}
          restore-keys: |
            desktop-downloads-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Velopack CLI
        run: |
          binding=$(node -p 'require("./node_modules/velopack/package.json").version')
          if [ "$binding" != "$VPK_VERSION" ]; then
            echo "::error::velopack npm binding is $binding but VPK_VERSION is $VPK_VERSION"
            exit 1
          fi
          dotnet tool install --global vpk --version "$VPK_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Check the release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            pnpm --dir clients/apps/electron --silent release:version "$REF_NAME"
          elif [ "$PUBLISH_REQUESTED" = "true" ]; then
            echo "::error::Publishing needs a v<version> tag as the ref, not $REF_TYPE $REF_NAME."
            exit 1
          else
            pnpm --dir clients/apps/electron --silent release:version
          fi

      - name: Build, sign ad hoc, and pack
        env:
          # vpk reads the previous release for delta packages.
          GITHUB_TOKEN: ${{ github.token }}
          COMMA_PACK_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm --dir clients/apps/electron release:velopack:prod

      # Starts the assembled backend on an empty data directory with only
      # /usr/bin:/bin on PATH, checks that every listener is on 127.0.0.1, and
      # that a second preparation applies no migration again.
      - name: Prove the local backend
        run: pnpm --dir clients exec vitest run apps/electron/test/local-backend-runtime.test.ts

      - name: Report the DMG and transcription helper sizes
        run: |
          du -h clients/apps/electron/Releases/github/*.dmg
          du -h clients/apps/electron/out/*/*.app/Contents/Resources/native/macos/CommaTranscriber

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-macos-arm64-${{ steps.version.outputs.version }}
          path: clients/apps/electron/Releases/github/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release-macos-arm64-${{ needs.build.outputs.version }}
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          Comma for macOS (Apple silicon). Download `Comma-macos-arm64.dmg`.

          This build is not notarized by Apple. On the first install:

          1. Open the DMG and drag Comma to Applications.
          2. In Terminal, run `xattr -dr com.apple.quarantine /Applications/Comma.app`.
             Or open Comma once, then choose Open Anyway in
             System Settings > Privacy & Security.

          Installed copies update themselves from the latest release.
          NOTES
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "Comma $VERSION" \
            --notes-file notes.md
