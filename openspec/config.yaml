schema: spec-driven

# Contexto do harness Orchestrator.v5 (OpenSpec + Superpowers).
context: |
  Escreva os artefatos em pt-BR.
  O OpenSpec é a única fonte de proposta, specs, design e tarefas: openspec/changes/<mudança>/.
  O que uma skill Superpowers mandaria gravar em docs/superpowers/specs/ (brainstorming) vai para proposal.md e design.md; o que mandaria gravar em docs/superpowers/plans/ (writing-plans) vai para tasks.md. Não crie segunda spec nem segundo plano.

rules:
  tasks:
    - Tarefas pequenas, no formato "- [ ] N.M descrição", cada uma com como verificar.
    - Comportamento novo ou bug começa por teste que falha (test-driven-development).

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
